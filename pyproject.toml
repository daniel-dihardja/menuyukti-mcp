[project]
name = "menuyukti-gpt"
version = "0.1.0"
description = "Local Menuyukti ChatGPT plugin MCP server for sales analytics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "menuyukti",
]

[project.scripts]
menuyukti-gpt = "menuyukti_gpt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menuyukti_gpt"]

[tool.uv]
package = true

[tool.uv.sources]
menuyukti = { path = "packages/menuyukti", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
