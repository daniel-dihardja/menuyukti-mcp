# Rust binary releases are retired (TASK-44.10). Menuyukti MCP is the Skybridge
# TypeScript app under apps/menuyukti (Node 24+; `pnpm mcp`).
#
# Tag-triggered GitHub Release asset uploads for menuyukti-mcp are intentionally
# disabled. Reintroduce a Node/package release workflow here if/when needed.
name: Release

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Rust binary releases retired
        run: |
          echo "menuyukti-mcp Rust binary releases were retired in TASK-44.10."
          echo "Run the Skybridge app: pnpm mcp (apps/menuyukti, Node 24+)."
          exit 1
