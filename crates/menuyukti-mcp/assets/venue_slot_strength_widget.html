<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Venue slot strength</title>
    <style>
      :root {
        /* Host may override these via styles.variables; light-dark needs color-scheme. */
        color-scheme: light dark;
        --color-background-primary: light-dark(#ffffff, #171717);
        --color-background-secondary: light-dark(#f8fafc, #212121);
        --color-background-tertiary: light-dark(#f1f5f9, #2a2a2a);
        --color-background-warning: light-dark(#fef3c7, #422006);
        --color-text-primary: light-dark(#0f172a, #fafafa);
        --color-text-secondary: light-dark(#64748b, #a3a3a3);
        --color-text-warning: light-dark(#92400e, #fcd34d);
        --color-border-primary: light-dark(#e2e8f0, #404040);
        --color-background-info: light-dark(#eff6ff, #1e293b);
        --font-sans: "Segoe UI", system-ui, -apple-system, sans-serif;
        /* Sequential Blues: pale low → mid blue high (theme-aware). */
        --venue-low: light-dark(#dbeafe, #1e3a5f);
        --venue-high: light-dark(#2563eb, #60a5fa);
        --venue-cell-ink-on-high: light-dark(#f8fafc, #0f172a);
        /* Design inset lives on .panel — ChatGPT/Codex often crop body padding
           when sizing the iframe to inner content. */
        --pad-top: 48px;
        --pad-x: 32px;
        --pad-bottom: 32px;
        --safe-top: 0px;
        --safe-right: 0px;
        --safe-bottom: 0px;
        --safe-left: 0px;
        color: var(--color-text-primary);
        font-family: var(--font-sans);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-background-primary);
      }
      body {
        box-sizing: border-box;
      }
      .panel {
        box-sizing: border-box;
        width: 100%;
        padding: calc(var(--pad-top) + var(--safe-top))
          calc(var(--pad-x) + var(--safe-right))
          calc(var(--pad-bottom) + var(--safe-bottom))
          calc(var(--pad-x) + var(--safe-left));
        border: 0;
        border-radius: 0;
        background: var(--color-background-primary);
        color: var(--color-text-primary);
      }
      h2 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        color: var(--color-text-primary);
      }
      .desc {
        margin: 6px 0 0;
        color: var(--color-text-secondary);
        font-size: 0.8rem;
        line-height: 1.4;
      }
      .meta {
        margin: 10px 0 0;
        color: var(--color-text-secondary);
        font-size: 0.75rem;
      }
      .metric-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        margin-top: 14px;
      }
      .metric-label {
        color: var(--color-text-secondary);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .metric-seg {
        display: inline-flex;
        padding: 2px;
        border: 1px solid var(--color-border-primary);
        border-radius: 8px;
        background: var(--color-background-secondary);
        gap: 2px;
      }
      .metric-seg button {
        appearance: none;
        margin: 0;
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        background: transparent;
        color: var(--color-text-secondary);
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        line-height: 1.2;
      }
      .metric-seg button:hover {
        color: var(--color-text-primary);
      }
      .metric-seg button[aria-checked="true"] {
        background: var(--color-background-primary);
        color: var(--color-text-primary);
        box-shadow: 0 0 0 1px var(--color-border-primary);
      }
      .metric-seg button:focus-visible {
        outline: 2px solid var(--venue-high);
        outline-offset: 1px;
      }
      .showing {
        color: var(--color-text-secondary);
        font-size: 0.72rem;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--color-text-secondary);
        font-size: 0.75rem;
      }
      .legend-bar {
        flex: 1;
        min-width: 6rem;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--venue-low),
          color-mix(in srgb, var(--venue-high) 50%, var(--venue-low)),
          var(--venue-high)
        );
      }
      .tiers {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        font-size: 0.72rem;
        color: var(--color-text-secondary);
      }
      .tier {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tier-swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 1px solid var(--color-border-primary);
      }
      .scroll {
        margin-top: 14px;
        overflow-x: auto;
      }
      table {
        border-collapse: separate;
        border-spacing: 1px;
        width: 100%;
        min-width: 520px;
        font-size: 0.72rem;
        background: var(--color-background-primary);
        color: var(--color-text-primary);
      }
      th,
      td {
        border: 0;
        padding: 12px 4px;
        text-align: center;
      }
      th {
        background: var(--color-background-tertiary);
        font-weight: 600;
        color: var(--color-text-primary);
      }
      th.row-label,
      td.row-label {
        text-align: left;
        padding-left: 8px;
        white-space: nowrap;
        background: var(--color-background-secondary);
        font-weight: 600;
        color: var(--color-text-primary);
        position: sticky;
        left: 0;
        z-index: 1;
      }
      td.cell {
        font-weight: 600;
        min-width: 3.4rem;
        font-variant-numeric: tabular-nums;
        color: var(--color-text-primary);
      }
      td.cell.light-text {
        color: var(--venue-cell-ink-on-high);
      }
      .empty {
        margin-top: 16px;
        padding: 16px;
        border-radius: 8px;
        background: var(--color-background-warning);
        color: var(--color-text-warning);
        font-size: 0.9rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="panel">
      <h2>Venue slot strength</h2>
      <p class="desc">
        Weekday × meal-period demand. Index 1.0 = average traffic across all
        slots. Use for staffing and when to promote.
      </p>
      <p id="meta" class="meta"></p>
      <div id="metric-bar" class="metric-bar hidden">
        <span class="metric-label" id="metric-label">Show</span>
        <div
          class="metric-seg"
          role="radiogroup"
          aria-labelledby="metric-label"
          id="metric-seg"
        >
          <button
            type="button"
            role="radio"
            data-metric="demand"
            aria-checked="true"
            aria-label="Demand index"
          >
            Demand
          </button>
          <button
            type="button"
            role="radio"
            data-metric="orders"
            aria-checked="false"
            aria-label="Order count"
            tabindex="-1"
          >
            Orders
          </button>
          <button
            type="button"
            role="radio"
            data-metric="share"
            aria-checked="false"
            aria-label="Traffic share"
            tabindex="-1"
          >
            Share
          </button>
        </div>
        <span id="showing" class="showing"></span>
      </div>
      <div id="legend" class="legend hidden">
        <span>Low</span>
        <div class="legend-bar" aria-hidden="true"></div>
        <span>High</span>
        <span id="legend-metric" class="showing"></span>
      </div>
      <div id="tiers" class="tiers hidden">
        <span class="tier"
          ><span
            class="tier-swatch"
            style="background: var(--venue-low)"
          ></span>
          Low (&lt; 0.9 demand)</span
        >
        <span class="tier"
          ><span
            class="tier-swatch"
            style="
              background: color-mix(
                in srgb,
                var(--venue-high) 45%,
                var(--venue-low)
              );
            "
          ></span>
          Average demand</span
        >
        <span class="tier"
          ><span
            class="tier-swatch"
            style="background: var(--venue-high)"
          ></span>
          High (&gt; 1.1 demand)</span
        >
      </div>
      <div id="scroll" class="scroll hidden">
        <table>
          <thead>
            <tr id="head-row"></tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div id="empty" class="empty">
        Waiting for venue slot demand data…
      </div>
    </div>
    <script type="module">
      const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
      const DAY_LABELS = {
        mon: "Mon",
        tue: "Tue",
        wed: "Wed",
        thu: "Thu",
        fri: "Fri",
        sat: "Sat",
        sun: "Sun",
      };
      const PERIODS = [
        "breakfast",
        "lunch",
        "afternoon",
        "dinner",
        "late_night",
      ];
      const METRIC_KEY = "menuyukti-venue-slot-metric";
      const METRICS = {
        demand: {
          id: "demand",
          short: "Demand",
          showing: "Showing demand index",
          legend: "Color + number = demand index",
          field: (c) => Number(c.demand_index ?? c.demandIndex ?? 0),
          format: (n) =>
            Number.isFinite(n) ? n.toFixed(2) : "—",
        },
        orders: {
          id: "orders",
          short: "Orders",
          showing: "Showing order count",
          legend: "Color + number = orders",
          field: (c) => Number(c.order_count ?? c.orderCount ?? 0),
          format: (n) =>
            Number.isFinite(n) ? String(Math.round(n)) : "—",
        },
        share: {
          id: "share",
          short: "Share",
          showing: "Showing traffic share",
          legend: "Color + number = traffic share",
          field: (c) => Number(c.traffic_share ?? c.trafficShare ?? 0),
          format: (n) =>
            Number.isFinite(n) ? `${(n * 100).toFixed(1)}%` : "—",
        },
      };

      const root = document.documentElement;
      const panelEl = document.getElementById("panel");
      const metaEl = document.getElementById("meta");
      const metricBarEl = document.getElementById("metric-bar");
      const metricSegEl = document.getElementById("metric-seg");
      const showingEl = document.getElementById("showing");
      const legendEl = document.getElementById("legend");
      const legendMetricEl = document.getElementById("legend-metric");
      const tiersEl = document.getElementById("tiers");
      const scrollEl = document.getElementById("scroll");
      const emptyEl = document.getElementById("empty");
      const headRow = document.getElementById("head-row");
      const bodyEl = document.getElementById("body");

      let nextRpcId = 1;
      let hostFontStyleEl = null;
      let lastPayload = null;
      let activeMetric = loadMetric();

      function loadMetric() {
        try {
          const stored = localStorage.getItem(METRIC_KEY);
          if (stored && METRICS[stored]) return stored;
        } catch (_) {
          /* ignore */
        }
        return "demand";
      }

      function saveMetric(id) {
        try {
          localStorage.setItem(METRIC_KEY, id);
        } catch (_) {
          /* ignore */
        }
      }

      function px(n) {
        const v = Number(n);
        return Number.isFinite(v) ? `${Math.max(0, v)}px` : "0px";
      }

      function applyDocumentTheme(theme) {
        const mode = theme === "dark" || theme === "light" ? theme : null;
        if (!mode) return;
        root.style.colorScheme = mode;
        root.dataset.theme = mode;
        try {
          document.body.style.colorScheme = mode;
        } catch (_) {
          /* ignore */
        }
      }

      function applyHostStyleVariables(variables) {
        if (!variables || typeof variables !== "object") return;
        for (const [key, value] of Object.entries(variables)) {
          if (typeof key !== "string" || !key.startsWith("--")) continue;
          if (typeof value !== "string" || !value) continue;
          root.style.setProperty(key, value);
        }
      }

      function applyHostFonts(cssText) {
        if (typeof cssText !== "string" || !cssText.trim()) return;
        if (!hostFontStyleEl) {
          hostFontStyleEl = document.createElement("style");
          hostFontStyleEl.setAttribute("data-host-fonts", "true");
          document.head.appendChild(hostFontStyleEl);
        }
        hostFontStyleEl.textContent = cssText;
      }

      function applySafeArea(insets) {
        if (!insets || typeof insets !== "object") return;
        root.style.setProperty("--safe-top", px(insets.top));
        root.style.setProperty("--safe-right", px(insets.right));
        root.style.setProperty("--safe-bottom", px(insets.bottom));
        root.style.setProperty("--safe-left", px(insets.left));
        notifySize();
      }

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== "object") return;
        if (ctx.theme) applyDocumentTheme(ctx.theme);
        if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
        else if (ctx.styles?.cssVariables) {
          applyHostStyleVariables(ctx.styles.cssVariables);
        }
        if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
        if (ctx.safeAreaInsets) applySafeArea(ctx.safeAreaInsets);
        else if (ctx.safe_area_insets) applySafeArea(ctx.safe_area_insets);
        notifySize();
      }

      function notifySize() {
        try {
          if (!panelEl || !window.parent || window.parent === window) return;
          const rect = panelEl.getBoundingClientRect();
          const height = Math.ceil(
            Math.max(
              rect.height,
              panelEl.scrollHeight,
              document.documentElement.scrollHeight,
              document.body.scrollHeight
            )
          );
          const width = Math.ceil(
            Math.max(rect.width, panelEl.scrollWidth, document.body.scrollWidth)
          );
          window.parent.postMessage(
            {
              jsonrpc: "2.0",
              method: "ui/notifications/size-changed",
              params: { width, height },
            },
            "*"
          );
        } catch (_) {
          /* host may ignore */
        }
      }

      function syncMetricControls() {
        const metric = METRICS[activeMetric] || METRICS.demand;
        const buttons = metricSegEl.querySelectorAll("button[data-metric]");
        buttons.forEach((btn) => {
          const selected = btn.dataset.metric === metric.id;
          btn.setAttribute("aria-checked", selected ? "true" : "false");
          btn.tabIndex = selected ? 0 : -1;
        });
        showingEl.textContent = metric.showing;
        legendMetricEl.textContent = metric.legend;
      }

      function setMetric(id) {
        if (!METRICS[id] || id === activeMetric) {
          syncMetricControls();
          return;
        }
        activeMetric = id;
        saveMetric(id);
        syncMetricControls();
        if (lastPayload) renderFromStructured(lastPayload);
      }

      function showEmpty(message) {
        emptyEl.textContent = message;
        emptyEl.classList.remove("hidden");
        metricBarEl.classList.add("hidden");
        legendEl.classList.add("hidden");
        tiersEl.classList.add("hidden");
        scrollEl.classList.add("hidden");
        headRow.innerHTML = "";
        bodyEl.innerHTML = "";
        notifySize();
      }

      function showGrid() {
        emptyEl.classList.add("hidden");
        metricBarEl.classList.remove("hidden");
        legendEl.classList.remove("hidden");
        tiersEl.classList.remove("hidden");
        scrollEl.classList.remove("hidden");
        syncMetricControls();
        notifySize();
      }

      function intensity(value, min, max) {
        const range = max - min || 1;
        return Math.min(1, Math.max(0, (value - min) / range));
      }

      function cellBackground(t) {
        const pct = Math.round(Math.min(1, Math.max(0, t)) * 100);
        return `color-mix(in srgb, var(--venue-high) ${pct}%, var(--venue-low))`;
      }

      function formatIndex(value) {
        if (typeof value !== "number" || Number.isNaN(value)) return "—";
        return value.toFixed(2);
      }

      function periodLabel(cell) {
        if (!cell) return "";
        const label = cell.meal_period_label || cell.mealPeriodLabel || "";
        const hours =
          cell.meal_period_hours_label || cell.mealPeriodHoursLabel || "";
        if (label && hours) return `${label} (${hours})`;
        return label || cell.meal_period || cell.mealPeriod || "";
      }

      function renderFromStructured(data) {
        try {
          lastPayload = data;
          if (!data || typeof data !== "object") {
            showEmpty("No venue slot demand data yet.");
            return;
          }
          const profile = Array.isArray(data.slot_demand_profile)
            ? data.slot_demand_profile
            : Array.isArray(data.slotDemandProfile)
              ? data.slotDemandProfile
              : null;

          if (!profile) {
            showEmpty("Missing slot_demand_profile in tool result.");
            return;
          }
          if (profile.length === 0) {
            showEmpty("No demand slots in this period (empty profile).");
            return;
          }

          const metric = METRICS[activeMetric] || METRICS.demand;
          const byKey = new Map();
          for (const cell of profile) {
            const day = String(cell.day || "").toLowerCase();
            const period = String(
              cell.meal_period || cell.mealPeriod || ""
            ).toLowerCase();
            if (!day || !period) continue;
            byKey.set(`${day}:${period}`, cell);
          }

          const metricValues = profile
            .map((c) => metric.field(c))
            .filter((n) => Number.isFinite(n));
          const min = metricValues.length ? Math.min(...metricValues) : 0;
          const max = metricValues.length ? Math.max(...metricValues) : 1;

          const demandValues = profile
            .map((c) => Number(c.demand_index ?? c.demandIndex))
            .filter((n) => Number.isFinite(n));
          const demandMin = demandValues.length ? Math.min(...demandValues) : 0;
          const demandMax = demandValues.length ? Math.max(...demandValues) : 1;

          const pos = data.pos ? String(data.pos) : "";
          const slotCount =
            data.slot_count ?? data.slotCount ?? profile.length;
          const rangeLabel =
            metric.id === "demand"
              ? `index range ${formatIndex(min)}–${formatIndex(max)}`
              : metric.id === "orders"
                ? `orders ${metric.format(min)}–${metric.format(max)}`
                : `share ${metric.format(min)}–${metric.format(max)}`;
          metaEl.textContent = [
            pos ? `POS: ${pos}` : null,
            `${slotCount} slots`,
            rangeLabel,
            metric.id !== "demand"
              ? `demand ${formatIndex(demandMin)}–${formatIndex(demandMax)}`
              : null,
          ]
            .filter(Boolean)
            .join(" · ");

          headRow.innerHTML = "";
          const corner = document.createElement("th");
          corner.className = "row-label";
          corner.textContent = "Meal period";
          headRow.appendChild(corner);
          for (const day of DAYS) {
            const th = document.createElement("th");
            th.textContent = DAY_LABELS[day];
            headRow.appendChild(th);
          }

          bodyEl.innerHTML = "";
          for (const period of PERIODS) {
            const tr = document.createElement("tr");
            const sample =
              byKey.get(`mon:${period}`) ||
              DAYS.map((d) => byKey.get(`${d}:${period}`)).find(Boolean);
            const labelTd = document.createElement("td");
            labelTd.className = "row-label";
            labelTd.textContent = periodLabel(sample) || period;
            tr.appendChild(labelTd);

            for (const day of DAYS) {
              const cell = byKey.get(`${day}:${period}`);
              const td = document.createElement("td");
              td.className = "cell";
              if (!cell) {
                td.textContent = "—";
                tr.appendChild(td);
                continue;
              }
              const index = Number(cell.demand_index ?? cell.demandIndex ?? 0);
              const relative = String(
                cell.relative_demand || cell.relativeDemand || "average"
              ).toLowerCase();
              const orders = Number(cell.order_count ?? cell.orderCount ?? 0);
              const share = Number(cell.traffic_share ?? cell.trafficShare ?? 0);
              const value = metric.field(cell);
              const t = intensity(value, min, max);
              td.dataset.relative = relative;
              td.style.backgroundColor = cellBackground(t);
              if (t > 0.75) td.classList.add("light-text");
              td.textContent = metric.format(value);
              td.title = `${DAY_LABELS[day]} · ${periodLabel(cell) || period}
Orders: ${orders}
Traffic share: ${(share * 100).toFixed(1)}%
Demand index: ${formatIndex(index)}
Relative: ${relative}`;
              tr.appendChild(td);
            }
            bodyEl.appendChild(tr);
          }
          showGrid();
        } catch (err) {
          showEmpty(`Could not render heatmap: ${String(err)}`);
        }
      }

      function renderFromToolResult(params) {
        const structured =
          params?.structuredContent ??
          params?.structured_content ??
          params;
        renderFromStructured(structured);
      }

      function handshakeHost() {
        try {
          if (!window.parent || window.parent === window) return;
          const id = nextRpcId++;
          window.parent.postMessage(
            {
              jsonrpc: "2.0",
              id,
              method: "ui/initialize",
              params: {
                appInfo: {
                  name: "menuyukti-venue-slot-strength",
                  version: "5",
                },
                appCapabilities: {
                  availableDisplayModes: ["inline", "fullscreen"],
                },
                protocolVersion: "2026-01-26",
              },
            },
            "*"
          );
        } catch (_) {
          /* preview / non-MCP host */
        }
      }

      function applyFallbackThemeFromEnvironment() {
        try {
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          applyDocumentTheme(prefersDark ? "dark" : "light");
        } catch (_) {
          applyDocumentTheme("light");
        }
      }

      function wireMetricControl() {
        const buttons = [
          ...metricSegEl.querySelectorAll("button[data-metric]"),
        ];
        buttons.forEach((btn, index) => {
          btn.addEventListener("click", () => setMetric(btn.dataset.metric));
          btn.addEventListener("keydown", (event) => {
            let next = null;
            if (event.key === "ArrowRight" || event.key === "ArrowDown") {
              next = buttons[(index + 1) % buttons.length];
            } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
              next = buttons[(index - 1 + buttons.length) % buttons.length];
            } else if (event.key === "Home") {
              next = buttons[0];
            } else if (event.key === "End") {
              next = buttons[buttons.length - 1];
            } else if (event.key === " " || event.key === "Enter") {
              event.preventDefault();
              setMetric(btn.dataset.metric);
              return;
            }
            if (next) {
              event.preventDefault();
              setMetric(next.dataset.metric);
              next.focus();
            }
          });
        });
        syncMetricControls();
      }

      try {
        applyFallbackThemeFromEnvironment();
        wireMetricControl();

        if (typeof window !== "undefined" && window.openai) {
          if (window.openai.theme) applyDocumentTheme(window.openai.theme);
          if (window.openai.toolOutput) {
            renderFromToolResult(window.openai.toolOutput);
          }
          const safe =
            window.openai.safeArea?.insets || window.openai.safeAreaInsets;
          if (safe) applySafeArea(safe);
        }

        handshakeHost();

        window.addEventListener(
          "message",
          (event) => {
            if (event.source !== window.parent) return;
            const message = event.data;
            if (!message || message.jsonrpc !== "2.0") return;

            if (message.method === "ui/notifications/tool-result") {
              renderFromToolResult(message.params);
              return;
            }
            if (
              message.method === "ui/notifications/host-context-changed" ||
              message.method === "ui/notifications/hostContextChanged"
            ) {
              applyHostContext(message.params?.hostContext || message.params);
              return;
            }
            if (message.result?.hostContext) {
              applyHostContext(message.result.hostContext);
            }
          },
          { passive: true }
        );

        requestAnimationFrame(() => notifySize());
      } catch (err) {
        showEmpty(`Bridge error: ${String(err)}`);
      }
    </script>
  </body>
</html>
