<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello World widget</title>
    <style>
      :root {
        color: #0f172a;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        box-sizing: border-box;
        padding: 20px;
        background: linear-gradient(145deg, #0ea5e9 0%, #6366f1 55%, #a855f7 100%);
      }
      .panel {
        box-sizing: border-box;
        width: 100%;
        min-height: 220px;
        padding: 28px 24px;
        border: 4px solid #0f172a;
        border-radius: 20px;
        background: #fff7ed;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.28);
      }
      .badge {
        display: inline-block;
        margin: 0 0 16px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #0f172a;
        color: #f8fafc;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #label {
        margin: 0;
        color: #9a3412;
        font-size: clamp(2.75rem, 8vw, 4.5rem);
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      #source {
        margin: 18px 0 0;
        color: #7c2d12;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .hint {
        margin: 20px 0 0;
        color: #57534e;
        font-size: 1rem;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="badge">MCP Apps widget</div>
      <p id="label">Hello World</p>
      <p id="source">source: mock (initial paint)</p>
      <p class="hint">
        If you can see this framed panel with the giant headline, ChatGPT is
        rendering the iframe UI — not plain chat text.
      </p>
    </div>
    <script type="module">
      const labelEl = document.getElementById("label");
      const sourceEl = document.getElementById("source");

      function renderFromStructured(data) {
        try {
          if (!data || typeof data !== "object") return;
          const message = data.message;
          const source = data.source;
          if (typeof message === "string" && message.length > 0) {
            labelEl.textContent = message;
          }
          if (typeof source === "string" && source.length > 0) {
            sourceEl.textContent = `source: ${source}`;
          }
        } catch (err) {
          sourceEl.textContent = `render error: ${String(err)}`;
        }
      }

      function renderFromToolResult(params) {
        const structured =
          params?.structuredContent ??
          params?.structured_content ??
          params;
        renderFromStructured(structured);
      }

      try {
        // ChatGPT compatibility alias when the host exposes window.openai.
        if (typeof window !== "undefined" && window.openai?.toolOutput) {
          renderFromToolResult(window.openai.toolOutput);
        }

        window.addEventListener(
          "message",
          (event) => {
            if (event.source !== window.parent) return;
            const message = event.data;
            if (!message || message.jsonrpc !== "2.0") return;
            if (message.method !== "ui/notifications/tool-result") return;
            renderFromToolResult(message.params);
          },
          { passive: true }
        );
      } catch (err) {
        sourceEl.textContent = `bridge error: ${String(err)}`;
      }
    </script>
  </body>
</html>
