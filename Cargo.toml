[workspace]
resolver = "2"
members = [
    "crates/menuyukti",
    "crates/menuyukti-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Menuyukti"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
calamine = { version = "0.38", features = ["chrono", "dates"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rmcp = { version = "3.8.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
menuyukti = { path = "crates/menuyukti" }
